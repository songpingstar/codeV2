                        example: 1
                      username:
                        type: string
                        example: admin
                      email:
                        type: string
                        example: admin@example.com
                      role:
                        type: string
                        enum: [admin, ops, readonly]
                        example: admin
                      status:
                        type: string
                        enum: [active, inactive]
                        example: active

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT认证令牌，在请求头中传递：Authorization: Bearer {token}
