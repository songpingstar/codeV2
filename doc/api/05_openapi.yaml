openapi: 3.0.3
info:
  title: 运维任务调度系统 API
  description: 运维任务调度系统的RESTful API接口文档
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000/api/v1
    description: 开发环境
  - url: https://api.example.com/api/v1
    description: 生产环境

tags:
  - name: Dashboard
    description: 仪表盘相关接口
  - name: Script
    description: 脚本管理相关接口
  - name: Task
    description: 任务调度相关接口
  - name: Execution
    description: 执行记录相关接口
  - name: Node
    description: 节点管理相关接口
  - name: User
    description: 用户权限相关接口
  - name: Category
    description: 脚本分类相关接口
  - name: Config
    description: 系统配置相关接口
  - name: Auth
    description: 认证授权相关接口
  - name: Agent
    description: Agent通信相关接口

paths:
  /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: 获取仪表盘统计数据
      description: 获取今日执行任务数、成功率、在线节点数等关键指标
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      today_executions:
                        type: integer
                        example: 127
                      success_rate:
                        type: number
                        format: float
                        example: 98.4
                      online_nodes:
                        type: integer
                        example: 12
                      total_nodes:
                        type: integer
                        example: 14

  /dashboard/script-distribution:
    get:
      tags:
        - Dashboard
      summary: 获取脚本类型分布
      description: 获取Python和Shell脚本的数量分布
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      python:
                        type: integer
                        example: 28
                      shell:
                        type: integer
                        example: 17

  /dashboard/task-stats:
    get:
      tags:
        - Dashboard
      summary: 获取调度任务统计
      description: 获取定时任务、触发式、手动任务的数量
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      scheduled:
                        type: integer
                        example: 32
                      triggered:
                        type: integer
                        example: 18
                      manual:
                        type: integer
                        example: 23

  /dashboard/recent-executions:
    get:
      tags:
        - Dashboard
      summary: 获取最近执行记录
      description: 获取最近N条执行记录
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 返回记录数量
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: exec_20240130_143025_001
                        script_name:
                          type: string
                          example: 系统巡检脚本
                        status:
                          type: string
                          enum: [pending, running, success, failed, timeout]
                          example: success
                        node:
                          type: string
                          example: node-01
                        start_time:
                          type: string
                          example: 2026-01-30 14:30:25
                        duration:
                          type: string
                          example: 2m 15s

  /scripts:
    get:
      tags:
        - Script
      summary: 获取脚本列表
      description: 分页查询脚本列表，支持关键词搜索和筛选
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: 脚本类型
          required: false
          schema:
            type: string
            enum: [Python, Shell]
        - name: category_id
          in: query
          description: 分类ID
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 45
                      page:
                        type: integer
                        example: 1
                      size:
                        type: integer
                        example: 20
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 系统巡检脚本
                            type:
                              type: string
                              enum: [Python, Shell]
                              example: Python
                            category_id:
                              type: integer
                              example: 1
                            category_name:
                              type: string
                              example: 监控告警
                            maintainer:
                              type: string
                              example: 张三
                            updated_at:
                              type: string
                              example: 2026-01-28 14:30:00
    post:
      tags:
        - Script
      summary: 创建脚本
      description: 创建新的脚本
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - category_id
                - content
                - maintainer
              properties:
                name:
                  type: string
                  example: 系统巡检脚本
                type:
                  type: string
                  enum: [Python, Shell]
                  example: Python
                category_id:
                  type: integer
                  example: 1
                content:
                  type: string
                  example: "#!/usr/bin/env python3\nprint('Hello, World!')"
                description:
                  type: string
                  example: 定期检查系统健康状态
                maintainer:
                  type: string
                  example: 张三
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 系统巡检脚本
                      type:
                        type: string
                        example: Python
                      category_id:
                        type: integer
                        example: 1
                      content:
                        type: string
                        example: "#!/usr/bin/env python3\nprint('Hello, World!')"
                      version:
                        type: string
                        example: 1.0.0
                      created_at:
                        type: string
                        example: 2026-01-28 14:30:00

  /scripts/{id}:
    get:
      tags:
        - Script
      summary: 获取脚本详情
      description: 获取指定脚本的详细信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 脚本ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 系统巡检脚本
                      type:
                        type: string
                        example: Python
                      category_id:
                        type: integer
                        example: 1
                      category_name:
                        type: string
                        example: 监控告警
                      content:
                        type: string
                        example: "#!/usr/bin/env python3\nprint('Hello, World!')"
                      description:
                        type: string
                        example: 定期检查系统健康状态
                      maintainer:
                        type: string
                        example: 张三
                      version:
                        type: string
                        example: 1.0.0
                      created_by:
                        type: string
                        example: 张三
                      created_at:
                        type: string
                        example: 2026-01-28 14:30:00
                      updated_at:
                        type: string
                        example: 2026-01-28 14:30:00
    put:
      tags:
        - Script
      summary: 更新脚本
      description: 更新脚本信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 脚本ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 系统巡检脚本
                type:
                  type: string
                  enum: [Python, Shell]
                  example: Python
                category_id:
                  type: integer
                  example: 1
                content:
                  type: string
                  example: "#!/usr/bin/env python3\nprint('Hello, World!')"
                description:
                  type: string
                  example: 定期检查系统健康状态
                maintainer:
                  type: string
                  example: 张三
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 系统巡检脚本
                      type:
                        type: string
                        example: Python
                      category_id:
                        type: integer
                        example: 1
                      content:
                        type: string
                        example: "#!/usr/bin/env python3\nprint('Hello, World!')"
                      version:
                        type: string
                        example: 1.0.1
                      updated_at:
                        type: string
                        example: 2026-01-28 15:30:00
    delete:
      tags:
        - Script
      summary: 删除脚本
      description: 删除指定脚本
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 脚本ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    nullable: true

  /scripts/{id}/execute:
    post:
      tags:
        - Script
      summary: 立即执行脚本
      description: 手动触发脚本执行
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 脚本ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - node_ids
                - environment
              properties:
                node_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
                environment:
                  type: string
                  enum: [dev, test, prod]
                  example: prod
                parameters:
                  type: object
                  example: {"key": "value"}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      execution_id:
                        type: string
                        example: exec_20240130_143025_001
                      status:
                        type: string
                        enum: [pending, running, success, failed, timeout]
                        example: pending
                      started_at:
                        type: string
                        example: 2026-01-30 14:30:25

  /scheduled-tasks:
    get:
      tags:
        - Task
      summary: 获取调度任务列表
      description: 分页查询调度任务列表，支持关键词搜索和筛选
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 任务状态
          required: false
          schema:
            type: string
            enum: [enabled, disabled]
        - name: environment
          in: query
          description: 执行环境
          required: false
          schema:
            type: string
            enum: [dev, test, prod]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 50
                      page:
                        type: integer
                        example: 1
                      size:
                        type: integer
                        example: 20
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 每日系统巡检
                            script_id:
                              type: integer
                              example: 1
                            script_name:
                              type: string
                              example: 系统巡检脚本
                            cron_expression:
                              type: string
                              example: "0 9 * * *"
                            cron_description:
                              type: string
                              example: 每天 09:00
                            enabled:
                              type: boolean
                              example: true
                            next_run_time:
                              type: string
                              example: 2026-01-30 09:00:00
                            last_run_time:
                              type: string
                              example: 2026-01-29 09:00:00
                            last_run_status:
                              type: string
                              enum: [success, failed, timeout]
                              example: success
    post:
      tags:
        - Task
      summary: 创建调度任务
      description: 创建新的调度任务
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - script_id
                - cron_expression
                - environment
              properties:
                name:
                  type: string
                  example: 每日系统巡检
                script_id:
                  type: integer
                  example: 1
                cron_expression:
                  type: string
                  example: "0 9 * * *"
                cron_description:
                  type: string
                  example: 每天 09:00
                environment:
                  type: string
                  enum: [dev, test, prod]
                  example: prod
                execution_mode:
                  type: string
                  enum: [all, specified]
                  default: all
                  example: all
                target_nodes:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 每日系统巡检
                      script_id:
                        type: integer
                        example: 1
                      cron_expression:
                        type: string
                        example: "0 9 * * *"
                      enabled:
                        type: boolean
                        example: true
                      next_run_time:
                        type: string
                        example: 2026-01-30 09:00:00
                      created_at:
                        type: string
                        example: 2026-01-28 14:30:00

  /scheduled-tasks/{id}:
    get:
      tags:
        - Task
      summary: 获取调度任务详情
      description: 获取指定调度任务的详细信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 任务ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 每日系统巡检
                      script_id:
                        type: integer
                        example: 1
                      script_name:
                        type: string
                        example: 系统巡检脚本
                      cron_expression:
                        type: string
                        example: "0 9 * * *"
                      cron_description:
                        type: string
                        example: 每天 09:00
                      environment:
                        type: string
                        example: prod
                      execution_mode:
                        type: string
                        example: all
                      target_nodes:
                        type: array
                        items:
                          type: integer
                        example: [1, 2, 3]
                      enabled:
                        type: boolean
                        example: true
                      next_run_time:
                        type: string
                        example: 2026-01-30 09:00:00
                      last_run_time:
                        type: string
                        example: 2026-01-29 09:00:00
                      last_run_status:
                        type: string
                        example: success
                      created_by:
                        type: string
                        example: 张三
                      created_at:
                        type: string
                        example: 2026-01-28 14:30:00
                      updated_at:
                        type: string
                        example: 2026-01-28 14:30:00
    put:
      tags:
        - Task
      summary: 更新调度任务
      description: 更新调度任务信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 任务ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 每日系统巡检
                script_id:
                  type: integer
                  example: 1
                cron_expression:
                  type: string
                  example: "0 9 * * *"
                cron_description:
                  type: string
                  example: 每天 09:00
                environment:
                  type: string
                  enum: [dev, test, prod]
                  example: prod
                execution_mode:
                  type: string
                  enum: [all, specified]
                  example: all
                target_nodes:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 每日系统巡检
                      script_id:
                        type: integer
                        example: 1
                      cron_expression:
                        type: string
                        example: "0 9 * * *"
                      enabled:
                        type: boolean
                        example: true
                      next_run_time:
                        type: string
                        example: 2026-01-30 09:00:00
                      updated_at:
                        type: string
                        example: 2026-01-28 15:30:00
    delete:
      tags:
        - Task
      summary: 删除调度任务
      description: 删除指定调度任务
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 任务ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    nullable: true

  /scheduled-tasks/{id}/toggle:
    put:
      tags:
        - Task
      summary: 启用/暂停调度任务
      description: 切换调度任务的启用状态
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 任务ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  example: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      enabled:
                        type: boolean
                        example: true
                      next_run_time:
                        type: string
                        example: 2026-01-30 09:00:00

  /scheduled-tasks/stats:
    get:
      tags:
        - Task
      summary: 获取调度任务统计
      description: 获取调度任务的数量统计
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 50
                      enabled:
                        type: integer
                        example: 32
                      disabled:
                        type: integer
                        example: 18

  /executions:
    get:
      tags:
        - Execution
      summary: 获取执行记录列表
      description: 分页查询执行记录列表，支持关键词搜索和筛选
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 执行状态
          required: false
